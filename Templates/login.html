<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Administrator — CivicPulse</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/civicpulse.css') }}">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            background: var(--canvas);
            color: var(--ink);
            font: 14px/1.55 var(--body);
        }
        .login-card {
            width: min(400px, 100%);
            padding: 30px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-top: 3px solid var(--navy);
            border-radius: 10px;
            box-shadow: 0 8px 20px -6px rgba(20, 21, 23, .08);
            animation: fade-up 260ms var(--ease-out) both;
        }
        .wordmark { color: var(--navy); font: 700 16px var(--heading); letter-spacing: -.025em; }
        h1 { margin: 26px 0 6px; font: 700 25px/1.2 var(--heading); letter-spacing: -.025em; }
        .description { margin: 0 0 24px; color: var(--muted); font-size: 13px; }
        .login-card .flash { margin-bottom: 12px; }
        form { display: grid; gap: 16px; }
        .field { display: grid; gap: 6px; }
        label { font-size: 12px; font-weight: 600; }
        input {
            width: 100%;
            min-height: 42px;
            padding: 9px 10px;
            border: 1px solid #CFCFCA;
            border-radius: 6px;
            background: #fff;
            color: var(--ink);
            font: inherit;
        }
        input:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(24, 49, 83, .11); }
        .submit-button {
            min-height: 42px;
            margin-top: 4px;
            padding: 9px 14px;
            border: 1px solid var(--navy);
            border-radius: 6px;
            background: var(--navy);
            color: white;
            font: 600 13px var(--body);
            cursor: pointer;
            transition: background 180ms ease, transform 220ms var(--ease-out);
        }
        .submit-button:hover { background: var(--navy-hover); }
        .submit-button:active { transform: scale(.985); }
        .back-link {
            display: block;
            margin-top: 20px;
            color: var(--navy);
            font-size: 12px;
            font-weight: 600;
            text-align: center;
        }
        .back-link:hover { text-decoration: underline; text-underline-offset: 3px; }
        @keyframes fade-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 480px) { .login-card { padding: 24px 20px; } }
    </style>
</head>
<body>
    <main class="login-card">
        <a class="wordmark" href="{{ url_for('index') }}">CivicPulse</a>
        <h1>Login administrator</h1>
        <p class="description">Masuk untuk mengelola verifikasi dan status laporan masyarakat.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category }}" role="status">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="field">
                <label for="email">Email administrator</label>
                <input id="email" type="email" name="email" autocomplete="username" placeholder="nama@instansi.go.id" required>
            </div>
            <div class="field">
                <label for="password">Kata sandi</label>
                <input id="password" type="password" name="password" autocomplete="current-password" placeholder="Masukkan kata sandi" required>
            </div>
            <button class="submit-button" type="submit">Masuk ke dashboard</button>
        </form>

        <a class="back-link" href="{{ url_for('index') }}">Kembali ke halaman publik</a>
    </main>
</body>
</html>
